name: CI

on:
  # Every branch, so work branches (e.g. updates2) are tested before they are merged.
  # Tag pushes are not matched here; release.yml handles those.
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test
    # WPF (net10.0-windows) only builds on Windows.
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # The SDK version comes from global.json, so CI builds with the same SDK as a local build.
      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      # Locked mode: fail instead of resolving packages differently from packages.lock.json.
      - name: Restore
        run: dotnet restore AniMan.slnx --locked-mode

      - name: Build
        run: dotnet build AniMan.slnx --configuration Release --no-restore

      - name: Test
        # Microsoft.Testing.Platform (global.json "test.runner"); xunit v3 writes the TRX report.
        run: dotnet test AniMan.slnx --configuration Release --no-build --report-xunit-trx --report-xunit-trx-filename test-results.trx --results-directory TestResults

      - name: Test summary
        if: always()
        shell: pwsh
        run: |
          $trx = Get-ChildItem TestResults -Filter *.trx -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $trx) { "No test results were written." >> $env:GITHUB_STEP_SUMMARY; exit 0 }
          $c = ([xml](Get-Content $trx.FullName)).TestRun.ResultSummary.Counters
          "### Tests: $($c.passed) passed, $($c.failed) failed, $($c.notExecuted) skipped (of $($c.total))" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: ignore
          retention-days: 14

      # Fails the run when any direct or transitive package has a known advisory.
      - name: Check for vulnerable packages
        shell: pwsh
        run: |
          $report = dotnet list AniMan.slnx package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Output $report
          if ($LASTEXITCODE -ne 0) { Write-Error "dotnet list package failed"; exit 1 }
          if ($report -match 'has the following vulnerable packages') {
            Write-Error "Vulnerable NuGet packages found (see the list above)."
            exit 1
          }
