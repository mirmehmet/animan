name: CI

on:
  # Every branch, so work branches (e.g. updates2) are tested before they are merged.
  # Tag pushes are not matched here; release.yml handles those.
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test
    # WPF (net10.0-windows) only builds on Windows.
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore AniMan.slnx

      - name: Build
        run: dotnet build AniMan.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test AniMan.slnx --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"
