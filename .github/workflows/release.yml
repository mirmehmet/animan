name: Release

on:
  push:
    tags:
      - 'v*.*.*'

# Lets the built-in GITHUB_TOKEN create a Release (some repos default this to read-only).
# Actions are pinned to full commit SHAs (tag in the comment) so a moved tag cannot change them.
permissions:
  contents: write

jobs:
  release:
    name: Build, Test & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # MinVer derives the version from git tags — a shallow checkout can't see
          # them, so it would compute 0.0.0 instead of the pushed tag's version.
          # The full history also brings origin/main for the check below.
          fetch-depth: 0
          # Keep the write-scoped token out of .git/config, where any build or test
          # code (NuGet packages, MSBuild targets) could read it. Only the final
          # "Create GitHub Release" step receives it, through GH_TOKEN.
          persist-credentials: false

      # Releases ship only what is on main, where CI has already run (AM-114): a tag
      # pushed on another branch or a local commit stops here.
      - name: Require the tagged commit to be on main
        shell: pwsh
        run: |
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
            Write-Error "$env:GITHUB_REF_NAME points at $env:GITHUB_SHA, which is not on main. Merge to main, then tag there."
            exit 1
          }

      # Same SDK as CI and local builds (global.json), same packages (lock files).
      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore AniMan.slnx --locked-mode

      - name: Build
        run: dotnet build AniMan.slnx --configuration Release --no-restore

      - name: Test
        # Microsoft.Testing.Platform (global.json "test.runner"); xunit v3 writes the TRX report.
        run: dotnet test AniMan.slnx --configuration Release --no-build --report-xunit-trx --report-xunit-trx-filename test-results.trx --results-directory TestResults

      - name: Check for vulnerable packages
        shell: pwsh
        run: |
          $report = dotnet list AniMan.slnx package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Output $report
          if ($LASTEXITCODE -ne 0) { Write-Error "dotnet list package failed"; exit 1 }
          if ($report -match 'has the following vulnerable packages') {
            Write-Error "Vulnerable NuGet packages found (see the list above)."
            exit 1
          }

      # Single file, self-contained and win-x64 come from AniMan.csproj. Passing them here
      # as global properties would also apply them to the library projects and break the
      # locked restore.
      - name: Publish self-contained exe
        run: >
          dotnet publish src/AniMan/AniMan.csproj
          -c Release
          -p:PublishReadyToRun=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -p:RestoreLockedMode=true
          -o publish

      - name: Rename artifact and compute checksum
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          Rename-Item -Path "publish/AniMan.exe" -NewName "AniMan-$env:TAG_NAME.exe"
          $hash = (Get-FileHash -Path "publish/AniMan-$env:TAG_NAME.exe" -Algorithm SHA256).Hash
          "$hash  AniMan-$env:TAG_NAME.exe" | Out-File -FilePath "publish/AniMan-$env:TAG_NAME.exe.sha256" -Encoding ascii

      # Hand-written notes from docs/release-notes/<tag>.md when present; otherwise
      # GitHub's generated list of changes.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $assets = "publish/AniMan-$env:TAG_NAME.exe", "publish/AniMan-$env:TAG_NAME.exe.sha256"
          $notes = "docs/release-notes/$env:TAG_NAME.md"
          if (Test-Path $notes) {
            gh release create $env:TAG_NAME @assets --title "AniMan $env:TAG_NAME" --notes-file $notes
          } else {
            Write-Output "No $notes; using generated notes."
            gh release create $env:TAG_NAME @assets --title "AniMan $env:TAG_NAME" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
