name: Release

on:
  push:
    tags:
      - 'v*.*.*'

# Lets the built-in GITHUB_TOKEN create a Release (some repos default this to read-only).
# Actions are pinned to full commit SHAs (tag in the comment) so a moved tag cannot change them.
permissions:
  contents: write

jobs:
  release:
    name: Build, Test & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # MinVer derives the version from git tags — a shallow checkout can't see
          # them, so it would compute 0.0.0 instead of the pushed tag's version.
          fetch-depth: 0
          # Keep the write-scoped token out of .git/config, where any build or test
          # code (NuGet packages, MSBuild targets) could read it. Only the final
          # "Create GitHub Release" step receives it, through GH_TOKEN.
          persist-credentials: false

      - name: Setup .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore AniMan.slnx

      - name: Build
        run: dotnet build AniMan.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test AniMan.slnx --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Publish self-contained exe
        run: >
          dotnet publish src/AniMan/AniMan.csproj
          -c Release
          -r win-x64
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishReadyToRun=true
          --self-contained true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o publish

      - name: Rename artifact and compute checksum
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          Rename-Item -Path "publish/AniMan.exe" -NewName "AniMan-$env:TAG_NAME.exe"
          $hash = (Get-FileHash -Path "publish/AniMan-$env:TAG_NAME.exe" -Algorithm SHA256).Hash
          "$hash  AniMan-$env:TAG_NAME.exe" | Out-File -FilePath "publish/AniMan-$env:TAG_NAME.exe.sha256" -Encoding ascii

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release create $env:TAG_NAME "publish/AniMan-$env:TAG_NAME.exe" "publish/AniMan-$env:TAG_NAME.exe.sha256" --title "AniMan $env:TAG_NAME" --generate-notes
